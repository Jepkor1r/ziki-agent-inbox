<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issues · Ziki</title>
  <meta name="description" content="Ziki issue tracking interface — HNG15 mini-project" />
  <link rel="icon" href="assets/favicon.ico" sizes="16x16" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" sizes="any" />
  <link rel="icon" href="assets/icon1.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="assets/icon2.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#" aria-label="Ziki home"><img src="assets/ziki-logo-dark.png" alt="ziki" width="79" height="26" /></a>
      <span class="vsep" aria-hidden="true"></span>
      <button class="project" type="button" aria-label="Switch project, current: Zedu">Zedu <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <nav class="spaces" aria-label="Spaces">
        <a href="#" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg><span>Product</span></a>
        <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span>Marketing</span></a>
        <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.5 7.5 9.5 4.3-2 7.5-4.9 7.5-9.5V6L12 3Z"/></svg><span>Security</span></a>
      </nav>
      <div class="top-actions">
        <button class="pill-btn agents-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg><span>Agents</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="pill-btn user-btn" type="button" aria-label="Account menu, JLagart"><span class="avatar-j" aria-hidden="true">J</span><span class="uname">JLagart</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="pts" title="Your points"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><b>977.94</b> pts</span>
        <button class="bell" type="button" aria-label="Notifications, 31 unread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-n">31</span></button>
      </div>
    </div>
  </header>

  <main id="main" class="page">
    <div class="filters-row">
      <div class="filters" role="toolbar" aria-label="Issue filters">
        <button class="f f-inbox is-on" type="button" aria-pressed="true" title="Inbox"><span class="f-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><span class="sr-only">Inbox</span><span class="f-n" data-bind="needs">0</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic warn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9.5 14l2 2 3-4"/></svg></span><b>Requires confirmation</b><span class="f-n">0</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg></span><b>Open</b><span class="f-n">359</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1M10 3h4"/></svg></span><b>In progress</b><span class="f-n">83</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic ok"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><b>Done</b><span class="f-n">0</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 5 8 5 8 8s-8 3-8 8"/></svg></span><b>Ready to Merge</b><span class="f-n">0</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11M6 4l6 7 6-7"/></svg></span><b>Live</b><span class="f-n">0</span></button>
        <button class="f" type="button" aria-pressed="false"><span class="f-ic info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 13 7 5h10l2 8v6H5z"/></svg></span><b>All</b><span class="f-n">798</span></button>
      </div>
      <button class="sq-btn" type="button" aria-label="Pull requests"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M8 5c5 0 8 2 8 5"/></svg></button>
    </div>

    <section class="panel hero" aria-label="Your agent">
      <div class="hero-agent">
        <div class="ava is-idle" id="ava" role="img" aria-label="Agent JLagart">
          <span class="ava-halo"></span>
          <span class="ava-pulse"></span>
          <svg class="ava-track" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/></svg>
          <svg class="ava-arc" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" pathLength="100"/></svg>
          <svg class="ava-need" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/></svg>
          <span class="ava-face"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v6"/><circle cx="24" cy="7" r="2" fill="currentColor" stroke="none"/><rect x="9" y="14" width="30" height="24" rx="8"/><g class="eyes"><ellipse class="eye" cx="18.5" cy="25" rx="2.6" ry="3" fill="currentColor" stroke="none"/><ellipse class="eye" cx="29.5" cy="25" rx="2.6" ry="3" fill="currentColor" stroke="none"/></g><path class="mouth" d="M20 31.5q4 2.5 8 0"/></svg></span>
          <span class="confetti" aria-hidden="true"></span>
        </div>
        <p class="state" id="state">Standing by</p>
      </div>

      <div class="hero-run">
        <div class="goals" role="group" aria-label="Pick a goal to start">
          <button type="button" class="goal" data-goal="work" aria-pressed="false"><span class="g-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></span>Find work</button>
          <button type="button" class="goal" data-goal="promote" aria-pressed="false"><span class="g-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l7 4V6L7 10H4Z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg></span>Promote</button>
          <button type="button" class="goal" data-goal="bugs" aria-pressed="false"><span class="g-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="6" width="8" height="14" rx="4"/><path d="M19 13h-3M8 13H5M19 8l-3 1.5M5 8l3 1.5M19 18l-3-1.5M5 18l3-1.5M10 6l-1-2M14 6l1-2"/></svg></span>Fix bugs</button>
        </div>
        <button type="button" class="prog" id="prog" data-tip="Found → good fits" data-tip-tap aria-label="Progress">
          <span class="bar" aria-hidden="true"><span class="bar-fill" id="bar"></span><span class="bar-need" id="bar-need"></span></span>
          <span class="count mono" aria-hidden="true"><b id="n-found">0</b><i>→</i><b id="n-fit">0</b></span>
        </button>
        <ol class="steps" id="steps" aria-label="Agent steps"></ol>
      </div>

      <div class="hero-ctrl">
        <div class="ctrl-row">
          <button type="button" class="round" id="btn-pause" aria-label="Pause" data-tip="Pause"></button>
          <button type="button" class="round" id="btn-stop" aria-label="Stop" data-tip="Stop"></button>
          <span class="stats">
            <button type="button" class="stat ok" data-tip="Confirmed · 30 days" data-tip-tap aria-label="15 confirmed in 30 days"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><b data-bind="ok">15</b></button>
            <button type="button" class="stat no" data-tip="Rejected · 30 days" data-tip-tap aria-label="2 rejected in 30 days"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><b>2</b></button>
            <button type="button" class="stat lock" data-tip="#perms" data-tip-tap aria-label="What your agent can do"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.5 7.5 9.5 4.3-2 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg></button>
          </span>
        </div>
        <div class="auto">
          <div class="auto-ic" aria-hidden="true">
            <button type="button" tabindex="-1" data-auto="1" data-tip="Ask me"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5v-5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V12m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.6a6 6 0 0 1-4.8-2.4L4.3 15.6a1.5 1.5 0 0 1 2.4-1.8L8 15.3"/></svg></button>
            <button type="button" tabindex="-1" data-auto="2" data-tip="Big things only"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
            <button type="button" tabindex="-1" data-auto="3" data-tip="Handle it"><svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/></svg></button>
          </div>
          <input type="range" id="auto" min="1" max="3" step="1" value="2" aria-label="Autonomy" aria-valuetext="Big things only" />
        </div>
      </div>
    </section>

    <template id="perms"><ul class="perms"><li><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>Search</li><li><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>Shortlist</li><li><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>Verify</li><li class="l"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Bid: asks you</li></ul></template>

    <div class="tabs" role="tablist" aria-label="Inbox">
      <button role="tab" id="t-need" aria-controls="p-need" aria-selected="true">Need your input <span class="tn" data-bind="needs">0</span></button>
      <button role="tab" id="t-design" aria-controls="p-other" aria-selected="false" tabindex="-1">Design feedback needed <span class="tn">0</span></button>
      <button role="tab" id="t-ideas" aria-controls="p-other" aria-selected="false" tabindex="-1">New ideas <span class="tn">613</span></button>
      <button role="tab" id="t-drafts" aria-controls="p-other" aria-selected="false" tabindex="-1">Drafted ideas <span class="tn">32</span></button>
    </div>

    <section id="p-need" role="tabpanel" aria-labelledby="t-need">
      <div class="table">
        <div class="thead" aria-hidden="true"><span>Imp.</span><span>Issue</span><span></span><span>Status</span><span>Priority</span><span></span></div>
        <ul id="rows" class="rows" aria-label="Issues that need you"></ul>
        <div id="empty" class="empty" hidden><span class="mini-bot" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="9" y="14" width="30" height="24" rx="8"/><path d="M24 8v6M16 25.5q2.5 2 5 0M27 25.5q2.5 2 5 0M20 31.5q4 2.5 8 0"/></svg></span><span data-bind="emptyText">All clear</span></div>
      </div>
      <p id="row-help" class="sr-only">Right arrow approves. Left arrow skips. A asks.</p>
    </section>

    <section id="p-other" role="tabpanel" hidden>
      <div class="table"><div class="empty"><span>Nothing in this prototype</span></div></div>
    </section>

    <details class="handled" id="handled">
      <summary><svg class="h-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><b>Handled by agent</b><span class="tn" data-bind="handled">0</span></summary>
      <ul id="handled-list" class="handled-list"></ul>
    </details>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-undo">Undo</button></div>
  <script src="script.js"></script>
</body>
</html>
